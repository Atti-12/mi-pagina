paths:
  static: static
  uploads: static/uploads
timezone: America/Mexico_City
markdown:
  engine: commonmark
  options:
    gfm: true
    linkify: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    breaks: false
    xhtml: false
    attributes: false
    typographer: false
    treat_indentation_as_code: true
_snippets_imports:
  hugo:
    exclude:
      - hugo_instagram
collections_config:
  pages:
    path: themes/ananke
    icon: wysiwyg
  archetypes:
    path: themes/ananke/archetypes
    icon: archive
    glob:
      - '!_index.md'
  i18n:
    path: themes/ananke/i18n
    icon: iron
    glob:
      - '!_index.md'
  layouts:
    path: themes/ananke/layouts
    icon: layers
    glob:
      - '!_index.md'
  scripts:
    path: themes/ananke/scripts
    icon: script
    glob:
      - '!_index.md'
  tests:
    path: themes/ananke/tests
    icon: lists
    glob:
      - '!_index.md'
