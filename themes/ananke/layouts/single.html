{{ define "main" }}

<!-- Background Video -->
<div class="sppb-youtube-video-bg" style="overflow: hidden; position: relative; height: 500px;">
    <iframe class="sppb-youtube-iframe" 
            src="//www.youtube.com/embed/{{ .Params.youtube_video_id }}?playlist={{ .Params.youtube_video_id }}&iv_load_policy=3&enablejsapi=1&disablekb=1&autoplay=1&controls=0&showinfo=0&rel=0&loop=1&wmode=transparent&widgetid=1&mute=1" 
            frameborder="0" 
            allowfullscreen 
            style="width: 100%; height: 100%; object-fit: cover;">
    </iframe>
</div>

<!-- Menú Destacados -->
<div class="menu-destacados-moderno">
    <div class="menu-destacados-header">
        {{ .Params.destacados_header }}
    </div>
    {{ range .Params.destacados }}
    <a class="menu-destacados-item" href="{{ .url }}" target="{{ default "_self" .target }}">
        <div class="menu-destacados-icon">
            <img src="{{ .icon }}" alt="{{ .text }}">
        </div>
        <span class="menu-destacados-text">{{ .text }}</span>
    </a>
    {{ end }}
</div>

<!-- Sección Motivos (Flip Cards) -->
<section class="my-5">
    <h2 class="text-center mb-4">{{ .Params.motivos_title }}</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 text-center">
        {{ range .Params.motivos_cards }}
        <div class="col">
            <div class="flip-card">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <img src="{{ .image }}" alt="{{ .title }}">
                        <p class="flip-card-title">{{ .title }}</p>
                        <span class="flip-arrow">→</span>
                    </div>
                    <div class="flip-card-back">
                        <h5>{{ .title }}</h5>
                        <p>{{ .description }}</p>
                    </div>
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</section>

<!-- Menú Soporte y Servicios -->
<div class="menu-soporte-contenedor">
    <div class="menu-soporte-moderno">
        {{ range .Params.soporte_items }}
        <a class="menu-soporte-item" href="{{ .url }}">
            <div class="menu-soporte-icon">
                <img src="{{ .icon }}" alt="{{ .text }}">
            </div>
            <span class="menu-soporte-text">{{ .text }}</span>
        </a>
        {{ end }}
    </div>
</div>

{{ end }}
